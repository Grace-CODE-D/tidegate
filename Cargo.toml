[package]
name = "tidegate"
version = "0.2.0"
edition = "2021"
description = "A Stellar RPC gateway with a Soroban gateway registry contract"
license = "MIT"
readme = "README.md"

[workspace]
resolver = "2"
members = [".", "contracts/*"]

[workspace.dependencies]
soroban-sdk = "29"

[dependencies]
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
codegen-units = 1
lto = true
panic = "abort"

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
